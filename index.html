<html lang="el"><head>
    <meta charset="UTF-8">
    <title>Panagiotis Radio F Y</title>
    <link href="https://fonts.googleapis.com/css2?family=Lucida:wght@400;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --Cobol-top: #dcdcdc; --Cobol-mid: #a8a8a8; --Cobol-bot: #606060;
            --Cobol-shine: rgba(255,255,255,0.18); --Cobol-dark: rgba(0,0,0,0.55);
            --border-c: rgba(255,255,255,0.25);
        }
        [data-c="black"] { --Cobol-top: #82b34b; --Cobol-mid: #161616; --Cobol-bot: #020202; --Cobol-dark: rgba(0,0,0,0.8); }
        [data-c="blue"] { --Cobol-top: #6fb3e8; --Cobol-mid: #2a72c3; --Cobol-bot: #0d3a7a; }
        [data-c="red"] { --Cobol-top: #e87070; --Cobol-mid: #c01818; --Cobol-bot: #5a0000; }
        [data-c="green"] { --Cobol-top: #70c870; --Cobol-mid: #1a881a; --Cobol-bot: #064006; }
        [data-c="pink"] { --Cobol-top: #f9a8d4; --Cobol-mid: #ec4899; --Cobol-bot: #831843; }
        [data-c="Sky"] { --Cobol-top: #c084fc; --Cobol-mid: #7c3aed; --Cobol-bot: #2e1065; }

        body { background-color: #111; color: #fff; font-family: 'Lucida', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; flex-direction: column; }

        .Thema {
            position: relative; 
            width: 100%px; 
            height: 486px; 
            padding: 15px;
            box-sizing: border-box;
            background: linear-gradient(180deg, var(--Cobol-top) 0%, var(--Cobol-mid) 20%, var(--Cobol-mid) 80%, var(--Cobol-bot) 100%);
            border-radius: 35px; border: 1px solid var(--border-c);
            box-shadow: inset 0 7px 16px var(--Cobol-shine), inset 0 -9px 20px var(--Cobol-dark), 0 28px 60px rgba(0,0,0,0.55);
            display: flex; flex-direction: column; justify-content: space-between; gap: 10px; transition: all .55s ease;
        }

        .top-bar { height: 45px; border: 1px solid rgba(0,0,0,0.3); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 0 15px; }
        .top-bar-gif { width: 35px; height: 35px; object-fit: contain; }
        .top-bar-title { color: #fff; font-size: 1.2rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); letter-spacing: 2px; white-space: nowrap; }

        .middle-section { display: flex; gap: 15px; height: 260px; }
        .side-slot-left { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; }
        
                        #album-art { 
            width: 140px; height: 140px; 
            border: 4px solid #000; 
            border-radius: 50%; 
            background-color: #222;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: transform 0.5s ease;
            overflow: hidden; /* ΚΡΥΒΕΙ ΤΟ URL ΠΟΥ ΒΓΑΙΝΕΙ ΕΞΩ */
            position: relative;
        }



        .rotating { animation: spin 5s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .vu-meter { position: relative; width: 130px; height: 55px; border: 2px solid #000; border-radius: 5px; background: #111; overflow: hidden; background-image: url('https://i.imgur.com/cBXsvc1.png'); background-size: contain; background-repeat: no-repeat; }
        .needle { position: absolute; bottom: -5px; left: 50%; width: 2px; height: 50px; background: #ff0000; transform-origin: bottom center; transform: rotate(-58deg); transition: transform 0.1s ease-out; }
        .main-screen { 
            flex: 2.5; 
            border: 3px solid #000; 
            border-radius: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000; 
            position: relative; 
            overflow: hidden; 
            transition: box-shadow 0.2s ease;
        }
        .main-screen.disco-lights {
            animation: rainbowBorder 1.5s linear infinite, discoStrobe 0.25s infinite alternate;
        }

        @keyframes rainbowBorder {
            0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
            17% { border-color: #ff7f00; box-shadow: 0 0 20px #ff7f00; }
            33% { border-color: #ffff00; box-shadow: 0 0 15px #ffff00; }
            50% { border-color: #00ff00; box-shadow: 0 0 20px #00ff00; }
            67% { border-color: #0000ff; box-shadow: 0 0 15px #0000ff; }
            83% { border-color: #8b00ff; box-shadow: 0 0 20px #8b00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        }

        @keyframes discoStrobe {
            0% { filter: brightness(1) contrast(1); }
            100% { filter: brightness(1.3) contrast(1.15); }
        }
        #mp4-display { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .bottom-controls { height: 75px; border: 1px solid rgba(0,0,0,0.2); border-radius: 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.15); padding: 0 10px; }
        .control-block { text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .label { font-size: 8px; color: #111; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; display: block; }
        .value-text { font-size: 1.0rem; color: #000; font-weight: bold; line-height: 1.1; }
        #clock-time { font-size: 1.1rem; color: #000; font-weight: bold; display: block; }
        #clock-date { font-size: 8px; color: #333; font-weight: bold; text-transform: uppercase; }

        .btn-toggle-main { width: 85px; padding: 8px; font-size: 0.7rem; font-weight: bold; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); background: linear-gradient(180deg, #444, #111); color: #fff; cursor: pointer; text-transform: uppercase; }

        #horoscope-sign { font-size: 9px; font-weight: bold; color: #be185d; text-transform: uppercase; display: block; }
        #horoscope-text { font-size: 8px; color: #19ed09; font-style: italic; line-height: 1.1; display: block; }

        .color-picker { display: flex; gap: 5px; justify-content: center; align-items: center; padding: 0 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid #fff; transition: 0.2s; box-shadow: 0 0 3px rgba(0,0,0,0.5); }
        .dot:hover { transform: scale(1.2); }

        .marquee-footer { width: 100%; height: 35px; border-radius: 8px; background: #000; overflow: hidden; border: 1px solid #19ed09; display: flex; align-items: center; }
        #track-info-scroll { font-size: 1.0rem; font-weight: bold; color: #00FF00; text-transform: uppercase; white-space: nowrap; }

               #weather-icon { width: 16px; vertical-align: middle; margin-right: 4px; }
        #temp { font-size: 0.9rem; color: #000; font-weight: bold; }

        .title-mask-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            background: transparent;
            display: flex;
            align-items: center; /* Τέλεια κατακόρυφη ευθυγράμμιση */
        }

        #metadataIframe {
            width: 450px;
            height: 40px;
            border: none;
            position: absolute;
            top: 0; /* Μηδενισμός για να ακούει στο flex κεντράρισμα */
            transform: scale(1.6);
            transform-origin: left center;
            
            /* ΑΓΡΙΟ, ΕΝΤΟΝΟ ΠΡΑΣΙΝΟ ΜΕ ΠΟΛΛΑΠΛΗ NEON ΛΑΜΨΗ */
            filter: invert(1) sepia(1) saturate(30) contrast(2) hue-rotate(85deg)
                    drop-shadow(0px 0px 4px #00FF00)
                    drop-shadow(0px 0px 10px #00FF00)
                    drop-shadow(0px 0px 15px #00FF00); 

            /* Ομαλή κίνηση Marquee */
            animation: marqueeEffect 12s linear infinite;
        }

        @keyframes marqueeEffect {
            0% { left: 100%; }
            100% { left: -140%; }
        }
        /* ΑΥΤΟΜΑΤΗ ΠΡΟΣΑΡΜΟΓΗ ΚΑΙ ΣΜΙΚΡΥΝΣΗ ΓΙΑ ΟΛΑ ΤΑ ΚΙΝΗΤΑ */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                box-sizing: border-box;
                height: 100vh;
                justify-content: center;
            }
            .Thema {
                /* Μετατρέπει τον player σε responsive χρησιμοποιώντας CSS Variables */
                transform: scale(calc(100vw / 780)); 
                transform-origin: center center;
                max-width: 728px;
                margin: 0 auto;
            }
        }
        @media (max-width: 480px) {
            .Thema {
                /* Πιο έντονη σμίκρυνση για πολύ μικρές οθόνες τηλεφώνων */
                transform: scale(calc(100vw / 760));
            }
        }

    </style>
</head>
<body data-c="Sky">

<div class="Thema" id="ThemaCobol">
    <div class="top-bar">
        <img src="https://xatimg.com/image/GKrvCKqdYfBD.gif" class="top-bar-gif">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="https://xatimg.com/image/TDqhlh9u1Lg6.png" class="top-bar-gif">
            <div class="top-bar-title">PANAGIOTIS RADIO</div>
            <img src="https://xatimg.com/image/NoAsG8Io1in8.png" class="top-bar-gif">
        </div>
        <img src="https://xatimg.com/image/GKrvCKqdYfBD.gif" class="top-bar-gif">
    </div>

    <div class="middle-section">
                <div class="side-slot-left">
            <!-- Εδώ είναι ο στρογγυλός κύκλος με την κρυμμένη και κλειδωμένη διεύθυνση URL -->
            <div id="album-art">
                <iframe class="widget-iframe" src="https://players.rcast.net/artistimageonly/200586" allow="autoplay" scrolling="no" style="width: 100%; height: 100%; border: none; background: transparent; position: absolute; top: 12px; left: 0; transform: scale(1.3); transform-origin: center top; pointer-events: none;"></iframe>
            </div>
            <div class="vu-meter"><div id="nL" class="needle"></div></div>
            <span class="label">AUDIO LEVEL</span>
        </div>

        <div class="main-screen" id="mainScreen">
            <video id="mp4-display" playsinline preload="auto">
                <source src="https://choises.github.io/fbg/c.mp4?v=2" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="bottom-controls">
        <div class="control-block">
            <span class="label">ΩΡΑ</span>

            <span id="clock-time">13:55:01</span>
            <span id="clock-date">Mer 13 Mag</span>
        </div>

        <div class="control-block">
            <span class="label">ΩΡΟΣΚΟΠΙΟ</span>

            <span id="horoscope-sign">Toro</span>
            <div id="horoscope-text">Mercoledì sereno.</div>
        </div>

        <button class="btn-toggle-main" id="mainBtn">LIVE</button>

        <div class="control-block">
            <span class="label">ΕΝΤΑΣΗ</span>

            <input type="range" id="vol" min="0" max="1" step="0.01" value="0.95" style="width: 50px;">
        </div>

        <div class="color-picker">
            <div class="dot" style="background:#dcdcdc" onclick="changeColor('silver')" title="Silver"></div>
            <div class="dot" style="background:#161616" onclick="changeColor('black')" title="Black"></div>
            <div class="dot" style="background:#2a72c3" onclick="changeColor('blue')" title="Blue"></div>
            <div class="dot" style="background:#c01818" onclick="changeColor('red')" title="Red"></div>
            <div class="dot" style="background:#1a881a" onclick="changeColor('green')" title="Green"></div>
            <div class="dot" style="background:#ec4899" onclick="changeColor('pink')" title="Pink"></div>
            <div class="dot" style="background:#7c3aed" onclick="changeColor('Sky')" title="Sky"></div>
        </div>

        
        <!-- Το ONLINE αφαιρέθηκε και το METEO πήρε όλο τον διαθέσιμο χώρο -->
        <div class="control-block" style="flex: 2;">
            <span class="label">ΚΑΙΡΟΣ</span>
            <div class="value-text" style="white-space: nowrap;">
                <img id="weather-icon" src="https://xatimg.com/image/CIlmgptYfBSD.png" alt="">
                <span id="temp">ΦΟΡΤΩΣΗ...</span>
            </div>
        </div>
    </div>

        <div class="marquee-footer">
        <!-- Ο μεγάλος, κυλιόμενος πράσινος τίτλος ενσωματωμένος στο πλαίσιο -->
        <div class="title-mask-container">
            <iframe id="metadataIframe" src="https://status.rcast.net/200586" scrolling="no"></iframe>
        </div>
    </div>


</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    (function() {
        const _0x4f22 = "2710";
        const _0x5a11 = "MjcxMDU0";
        const DEFAULT_IMG = "https://xatimg.com/image/wN0GwHPQejWO.png";
        const _STREAM = "https://stream.rcast.net/200586";
        const _API = "https://players.rcast.net/artistimageonly/200586";
        const audio = document.getElementById('audio');
        const mainBtn = document.getElementById('mainBtn');
        const albumArt = document.getElementById('album-art');
        const mp4Video = document.getElementById('mp4-display');
        const mainScreen = document.getElementById('mainScreen');
        let aCtx, analyser, dataArray, isPlaying = false, isAnnouncing = false;
        let lastTrack = "";

        window.changeColor = function(color) { 
            document.body.setAttribute('data-c', color); 
        };

        function startRadio() {
            audio.src = _STREAM;
            audio.play().then(() => {
                isPlaying = true;
                isAnnouncing = false;
                mainBtn.textContent = "STOP";
                mainBtn.style.background = "linear-gradient(180deg, #ff4444, #990000)";
                albumArt.classList.add('rotating');
                mainScreen.classList.add('disco-lights');

                if (!aCtx) {
                    aCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = aCtx.createAnalyser();
                    const src = aCtx.createMediaElementSource(audio);
                    src.connect(analyser);
                    analyser.connect(aCtx.destination);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                }
                draw();
            }).catch(() => {});
        }

        if (mp4Video) {
            mp4Video.onended = function() {
                startRadio();
            };
        }

        mainBtn.onclick = () => {
            if (!isPlaying && !isAnnouncing) {
                isAnnouncing = true;
                mainBtn.textContent = "WAIT...";
                mainBtn.style.background = "linear-gradient(180deg, #eab308, #ca8a04)";
               
                mainScreen.classList.add('disco-lights');

                if (mp4Video) {
                    mp4Video.muted = false;
                    mp4Video.volume = audio.volume;
                    mp4Video.currentTime = 0;
                    mp4Video.play().catch(() => {
                        startRadio();
                    });
                } else {
                    startRadio();
                }
            } else {
                if (mp4Video) { mp4Video.pause(); }
                audio.pause(); audio.src = ""; 
                isPlaying = false;
                isAnnouncing = false;
                mainBtn.textContent = "LIVE";
                mainBtn.style.background = "linear-gradient(180deg, #444, #111)";
                albumArt.classList.remove('rotating');
               
                mainScreen.classList.remove('disco-lights');
            }
        };

                function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const days = ['Κυρ', 'Δευ', 'Τρι', 'Τετ', 'Πεμ', 'Παρ', 'Σαβ'];
            const months = ['Ιαν', 'Φεβ', 'Μάρ', 'Απρ', 'Μάι', 'Ιούν', 'Ιούλ', 'Αύγ', 'Σεπ', 'Οκτ', 'Νοέ', 'Δεκ'];
            document.getElementById('clock-time').textContent = `${h}:${m}:${s}`;
            document.getElementById('clock-date').textContent = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;
        }

        setInterval(updateClock, 1000);

        async function fetchCover(songTitle) {
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(songTitle)}&media=music&limit=1`);
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                }
            } catch (e) {}
            return DEFAULT_IMG;
        }

                function getZodiacSign(day, month) {
            if((month==1 && day>=20)||(month==2 && day<=18)) return "Υδροχόος";
            if((month==2 && day>=19)||(month==3 && day<=20)) return "Ιχθύες";
            if((month==3 && day>=21)||(month==4 && day<=19)) return "Κριός";
            if((month==4 && day>=20)||(month==5 && day<=20)) return "Ταύρος";
            if((month==5 && day>=21)||(month==6 && day<=20)) return "Δίδυμοι";
            if((month==6 && day>=21)||(month==7 && day<=22)) return "Καρκίνος";
            if((month==7 && day>=23)||(month==8 && day<=22)) return "Λέων";
            if((month==8 && day>=23)||(month==9 && day<=22)) return "Παρθένος";
            if((month==9 && day>=23)||(month==10 && day<=22)) return "Ζυγός";
            if((month==10 && day>=23)||(month==11 && day<=21)) return "Σκορπιός";
            if((month==11 && day>=22)||(month==12 && day<=21)) return "Τοξότης";
            return "Αιγόκερως";
        }

               function updateHoroscope() {
            const now = new Date();
            const sign = getZodiacSign(now.getDate(), now.getMonth() + 1);
            const quotes = [
                "Κυριακή: Απόλυτη χαρά, χαλάρωση και πολλή αγάπη!",
                "Δευτέρα: Λάμψε! Μια φανταστική εβδομάδα σε περιμένει!",
                "Τρίτη: Χαμόγελα χωρίς τέλος και σούπερ θετική ενέργεια!",
                "Τετάρτη: Ευτυχία στον αέρα, ζήσε κάθε στιγμή με την καρδιά σου!",
                "Πέμπτη: Θαύματα έρχονται, αφήστε τη χαρά να σας εκπλήξει!",
                "Παρασκευή: Ενθουσιασμός στα ύψη, ώρα να γιορτάσεις τη ζωή!",
                "Σάββατο: Ασταμάτητη διασκέδαση και μαγικές στιγμές!"
            ];
            document.getElementById('horoscope-sign').textContent = sign;
            document.getElementById('horoscope-text').textContent = quotes[now.getDay()];
        }


                   function updateWeatherReal(){
        $.getJSON("https://get.geojs.io/v1/ip/geo.json", d=>{
            $.getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${d.latitude}&longitude=${d.longitude}&current_weather=true`, w=>{
                // Εμφανίζει το όνομα της πόλης και τη θερμοκρασία (π.χ. ATHENS 31°C)
                var cityName = d.city ? d.city.toUpperCase() : "ΑΘΗΝΑ";
                var temperature = Math.round(w.current_weather.temperature);
                $("#temp").html(cityName + " " + temperature + "°C");
            });
        });
    }




        function draw() {
            if (!isPlaying) return;
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            let avg = dataArray.reduce((a, b) => a + b) / dataArray.length;
            document.getElementById('nL').style.transform = `rotate(${-58 + (avg * 1.1)}deg)`;
        }

        async function updateData() {
            try {
                const res = await fetch(_API);
                const data = await res.json();
                if (data && data.now_playing) {
                    const song = data.now_playing.song;
                    const titleText = `${song.artist ? song.artist + ' - ' : ''}${song.title || ''}`;
                    if (titleText && titleText !== lastTrack) {
                        lastTrack = titleText;
                        $('#track-info-scroll').text(`${titleText} `);
                        if (song.art) {
                            albumArt.src = song.art;
                        } else {
                            const newCover = await fetchCover(titleText);
                            albumArt.src = newCover;
                        }
                    }
                    if (data.listeners) {
                        $('#listeners').text(data.listeners.total || 0);
                    }
                }
            } catch (e) {}
        }

        setInterval(updateData, 10000);
updateData();

 // Αυτόματη ανανέωση του νέου ζωντανού καιρού κάθε 15 λεπτά (900000 milliseconds)
        setInterval(updateWeatherReal, 900000);
                           // Αυτόματη ανανέωση του τίτλου rcast κάθε 10 δευτερόλεπτα χωρίς να επηρεάζεται η ροή
        function refreshRadioTitle() {
            const iframe = document.getElementById('metadataIframe');
            if (iframe) {
                iframe.src = iframe.src; 
            }
        }
        setInterval(refreshRadioTitle, 10000);



                updateWeatherReal();
updateHoroscope(); updateClock();
        
        document.getElementById('vol').oninput = (e) => { 
            audio.volume = e.target.value; 
            if (mp4Video) mp4Video.volume = e.target.value;
        };
    })();
</script>
</body></html>
